name: Publish the site

# Publishes the page whenever main changes. The island's state itself is kept
# fresh by the heartbeat workflow on the `state` branch; a copy of the latest
# checkpoint is bundled here as a fallback.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

concurrency:
  group: wigglewood-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Check the simulation is deterministic
        run: node scripts/test-determinism.mjs

      - name: Bundle the latest checkpoint
        run: |
          mkdir -p site/state
          if git fetch --depth=1 origin state 2>/dev/null; then
            git show FETCH_HEAD:latest.json > site/state/latest.json
            git show FETCH_HEAD:meta.json > site/state/meta.json
            cat site/state/meta.json
          fi

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - id: deploy
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - name: Wait before retrying the deploy
        if: steps.deploy.outcome == 'failure'
        run: sleep 30

      - id: deploy-retry
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v5

      # make sure a heartbeat is running (if one already is, this one waits its turn)
      - name: Wake the heartbeat
        run: |
          running=$(gh run list -R "$GITHUB_REPOSITORY" -w heartbeat.yml -s in_progress --json databaseId --jq length)
          queued=$(gh run list -R "$GITHUB_REPOSITORY" -w heartbeat.yml -s queued --json databaseId --jq length)
          pending=$(gh run list -R "$GITHUB_REPOSITORY" -w heartbeat.yml -s pending --json databaseId --jq length)
          if [ "$running" = "0" ] && [ "$queued" = "0" ] && [ "$pending" = "0" ]; then
            gh workflow run heartbeat.yml --ref main -R "$GITHUB_REPOSITORY"
            echo "started the heartbeat"
          else
            echo "heartbeat already running"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
