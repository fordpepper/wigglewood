<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wigglewood</title>
<meta name="description" content="A tiny shared island of dumplings and grumbles that keeps living on its own. Everyone sees the same world.">
<meta name="theme-color" content="#4e9fe2">
<meta property="og:title" content="Wigglewood">
<meta property="og:description" content="A tiny shared island of dumplings and grumbles that keeps living on its own. Everyone sees the same world.">
<meta property="og:image" content="https://fordpepper.github.io/wigglewood/og.jpg">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preload" href="fonts/pixelify-sans-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="world" aria-label="The island of Wigglewood. Drag to look around, pinch or scroll to zoom. Tap a creature to meet it, double tap to poke it, press and hold to pick it up and move it."></canvas>

<div class="clock pixel-box" id="clock">--:--</div>

<aside id="card" class="card pixel-box" hidden aria-label="Creature details">
  <canvas id="portrait" width="48" height="44" aria-hidden="true"></canvas>
  <div class="card-text">
    <h2 id="c-name">Name</h2>
    <p id="c-kind" class="c-kind"></p>
    <p id="c-status" class="c-status"></p>
    <span class="bar" title="Tummy"><i id="c-energy"></i></span>
  </div>
</aside>

<div id="loader" class="loader" role="status">
  <canvas id="loader-art" width="40" height="36" aria-hidden="true"></canvas>
  <p id="loader-text">Waking up Wigglewood…</p>
  <div class="progress pixel-box"><i id="loader-bar"></i></div>
</div>

<div id="toast" class="toast" hidden></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
