<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wigglewood</title>
<meta name="description" content="A world of little islands where dumplings and grumbles live and evolve on their own. Everyone sees the same world.">
<meta name="theme-color" content="#4e9fe2">
<meta property="og:title" content="Wigglewood">
<meta property="og:description" content="A world of little islands where dumplings and grumbles live and evolve on their own. Everyone sees the same world.">
<meta property="og:image" content="https://fordpepper.github.io/wigglewood/og.jpg">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preload" href="fonts/pixelify-sans-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/pixelify-sans-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="world" aria-label="The islands of Wigglewood. Drag to look around, pinch or scroll to zoom, tap a creature to meet it, double tap anywhere to find someone by name."></canvas>

<div class="clock pixel-box" id="clock">--:--</div>

<aside id="card" class="card pixel-box" hidden aria-label="Creature details">
  <canvas id="portrait" width="48" height="44" aria-hidden="true"></canvas>
  <div class="card-text">
    <h2 id="c-name">Name</h2>
    <p id="c-kind" class="c-kind"></p>
    <p id="c-status" class="c-status"></p>
    <span class="bar" title="Tummy"><i id="c-energy"></i></span>
  </div>
</aside>

<div id="tag" class="tag sel" hidden></div>
<div id="tag-hover" class="tag" hidden></div>

<div id="search" class="search pixel-box" hidden role="search">
  <div class="search-row">
    <input id="search-input" type="search" placeholder="Find someone by name" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search" aria-label="Find a creature by name" aria-controls="search-results">
    <button id="search-close" type="button" aria-label="Close search">&times;</button>
  </div>
  <p id="search-hint" class="search-hint">Type the start of a name, then tap who you want to find.</p>
  <ul id="search-results"></ul>
</div>

<div id="loader" class="loader" role="status">
  <canvas id="loader-art" width="40" height="36" aria-hidden="true"></canvas>
  <p id="loader-text">Waking up Wigglewood…</p>
  <div class="progress pixel-box"><i id="loader-bar"></i></div>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
